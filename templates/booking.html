<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="/" class="brand">
                <span class="brand-icon">🏋️</span>
                <span>GUDLFT</span>
            </a>
            <div class="nav-actions">
                <a href="{{ url_for('showSummary') }}" class="btn btn-outline" style="color: #ffffff; border-color: rgba(255,255,255,0.3); font-size: 0.825rem; padding: 0.4rem 0.875rem;">Back to Summary</a>
            </div>
        </div>
    </header>

    <main class="container auth-container">
        <div class="card">
            <div class="card-header">
                <h2>{{competition['name']}}</h2>
                <div class="card-subtitle">
                    Places available: <strong>{{competition['numberOfPlaces']}}</strong>
                </div>
            </div>

            <form action="/purchasePlaces" method="post">
                <input type="hidden" name="club" value="{{club['name']}}">
                <input type="hidden" name="competition" value="{{competition['name']}}">
                
                <div class="form-group">
                    <label for="places" class="form-label">How many places?</label>
                    <input type="number" name="places" id="places" class="form-input" min="1" max="12" placeholder="e.g. 2" required />
                    <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.25rem; display: block;">Maximum 12 places per club reservation.</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Book</button>
                    <a href="{{ url_for('showSummary') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; GUDLFT - Competition Management System</p>
    </footer>
</body>
</html>
